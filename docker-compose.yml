services:
  postgres:
    image: postgres:16-alpine
    container_name: spectraguard-postgres
    environment:
      POSTGRES_USER: spectraguard
      POSTGRES_PASSWORD: spectraguard_dev_password
      POSTGRES_DB: spectraguard_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectraguard -d spectraguard_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  spectraguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spectraguard-api
    environment:
      DATABASE_URL: postgresql://spectraguard:spectraguard_dev_password@postgres:5432/spectraguard_audit
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
